name: Daily Crypto Metrics to Google Sheets

on:
  schedule:
    - cron: '30 23 * * *'  # 每天 UTC 23:30 → 台灣 07:30
    - cron: '30 7 * * *'   # 每天 UTC 07:30 → 台灣 15:30
    - cron: '30 15 * * *'  # 每天 UTC 15:30 → 台灣 23:30
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests gspread oauth2client

      - name: Add credentials
        run: echo '${{ secrets.GSHEETS_CREDENTIALS }}' > credentials.json

      - name: Run update script
        run: python update_crypto_metrics.py
